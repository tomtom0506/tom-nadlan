name: בדיקת היתכנות - גרסאות לעם

# הרצה ידנית בלבד. אין קלט מהמשתמש, ולכן אין סיכון להזרקת פקודות.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run probe
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 api_probe.py

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/api_probe.json data/api_samples.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "probe: update probe results and samples"
          for i in 1 2 3 4 5; do
            git pull --rebase --quiet && git push --quiet && exit 0
            sleep 5
          done
          echo "push failed"; exit 1
