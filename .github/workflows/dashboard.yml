name: גיליון ראשי - עדכון יומי

# כל בוקר ב-07:30 שעון ישראל בחורף (04:30 UTC), וגם הרצה ידנית.
# הנתונים מה-API הציבורי /api/deals של over.org.il. סיכומים חודשיים נשמרים ב-data/months.
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 45 דקות: השלמת ההיסטוריה מה-API (כ-70 שניות לחודש). ריצה יומית רגילה לוקחת כ-7 דקות.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build dashboard data
        run: python3 build_dashboard.py

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json data/months
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "dashboard: daily update"
          for i in 1 2 3 4 5; do
            git pull --rebase --quiet && git push --quiet && exit 0
            sleep 5
          done
          echo "push failed"; exit 1

      # התראה בטלגרם כשאחד השלבים נכשל או שה-job נעצר (למשל חריגה מ-timeout), כדי שעצירה של העדכון היומי לא תעבור בשקט.
      # הסודות עוברים רק דרך env ולא מודפסים. הקישור לריצה נבנה מערכי GitHub ולא מקלט חיצוני.
      - name: Notify failure
        if: ${{ failure() || cancelled() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 notify_failure.py "העדכון היומי של הגיליון נכשל"
