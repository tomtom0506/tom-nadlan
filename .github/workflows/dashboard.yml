name: גיליון ראשי - עדכון יומי

# כל בוקר ב-07:30 שעון ישראל בחורף (04:30 UTC), וגם הרצה ידנית.
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build dashboard data
        run: python3 build_dashboard.py

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "dashboard: daily update"
          for i in 1 2 3 4 5; do
            git pull --rebase --quiet && git push --quiet && exit 0
            sleep 5
          done
          echo "push failed"; exit 1
